<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container" style="max-width:400px;margin:80px auto;text-align:center;">
        <h2>Login</h2>

        <form style="margin-top:25px;" onsubmit="location.href='home.html'; return false;">
            <label>Email</label><br>
            <input type="email" required style="width:100%;padding:10px;margin:10px 0;"><br>

            <label>Password</label><br>
            <input type="password" required style="width:100%;padding:10px;margin:10px 0;"><br>

            <button type="submit" class="btn" style="width:100%; margin-top:15px;">
                Login
            </button>
        </form>

        <p style="margin-top:15px;">Don't have an account?
            <a href="signup.html">Signup</a>
        </p>
    </main>

</body>

</html>
