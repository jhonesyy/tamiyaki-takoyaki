<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="signup-container" style="max-width:400px;margin:80px auto;text-align:center;">
    <h2>Create Account</h2>

    <form action="profile.html" method="get" style="margin-top:25px;">
        <label>Full Name</label><br>
        <input required style="width:100%;padding:10px;margin:10px 0;"><br>

        <label>Email</label><br>
        <input type="email" required style="width:100%;padding:10px;margin:10px 0;"><br>

        <label>Password</label><br>
        <input type="password" required style="width:100%;padding:10px;margin:10px 0;"><br>

        <button class="btn" style="width:100%;margin-top:15px;">Signup</button>
    </form>

    <p style="margin-top:15px;">Already have an account? 
        <a href="login.html">Login</a>
    </p>
</main>

</body>
</html>
